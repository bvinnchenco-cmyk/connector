version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: connector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/connector
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_prod}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY}
      AI_PIPELINE_URL: http://ai-pipeline:8000
      UPLOAD_DIR: /uploads
    volumes:
      - uploads:/uploads
    depends_on:
      - postgres
      - ai-pipeline

  ai-pipeline:
    build:
      context: ./apps/ai-pipeline
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY}
      BACKEND_URL: http://backend:3000
      UPLOAD_DIR: /uploads
      OUTPUT_DIR: /outputs
    volumes:
      - uploads:/uploads
      - outputs:/outputs
      - xtts_models:/root/.local/share/tts  # cache downloaded models
    deploy:
      resources:
        limits:
          memory: 4G   # XTTS needs ~2-3GB RAM

  ticket-agent:
    build:
      context: ./apps/ticket-agent
      dockerfile: Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TICKET_BOT_TOKEN}
      ADMIN_TELEGRAM_IDS: ${TICKET_ADMIN_IDS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VERCEL_TOKEN: ${VERCEL_TOKEN}
      BASE_DOMAIN: ${BASE_DOMAIN}
      TWITTER_API_KEY: ${TWITTER_API_KEY}
      TWITTER_API_SECRET: ${TWITTER_API_SECRET}
      TWITTER_ACCESS_TOKEN: ${TWITTER_ACCESS_TOKEN}
      TWITTER_ACCESS_SECRET: ${TWITTER_ACCESS_SECRET}
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD}
      THREADS_ACCESS_TOKEN: ${THREADS_ACCESS_TOKEN}
      THREADS_USER_ID: ${THREADS_USER_ID}
    restart: unless-stopped

volumes:
  pg_data:
  uploads:
  outputs:
  xtts_models:
